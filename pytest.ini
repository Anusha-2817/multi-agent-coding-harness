[pytest]
# Pins rootdir to the harness repo. Without an ini file here, pytest walks up
# past mach/ and roots itself in the parent directory.
testpaths = tests

# `tasks` holds fixture repos and `runs` holds their working copies. Both contain
# their own pytest suites, which belong to the fixtures under test -- they are
# data, not tests of the harness, and collecting them here would report a fixture's
# deliberate bug as a harness failure. testpaths covers a bare `pytest`;
# norecursedirs covers `pytest .` and any explicit directory argument.
#
# The first eight entries are pytest's own defaults, restated because setting
# this option replaces them rather than adding to them -- dropping them would
# send collection into .venv and .git.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} tasks runs
